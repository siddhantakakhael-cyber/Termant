name: Android APK

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Phones have ARM processors and the emulator below does not, so the reader of
  # pictures is also built and run on an ARM machine: it must read a real screenshot
  # and find the dog in a photo. Then the lines `phone look` makes are checked.
  reader-on-arm:
    name: Reader of pictures on an ARM machine
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          android/tools/build_mirage.sh "$PWD/libs" "$PWD/work"
          bash android/ci/mirage-check.sh libs/arm64-v8a/libmirage.so "$PWD/work"
          bash android/ci/look-check.sh "$PWD/work/look"
          bash android/ci/learn-check.sh android/assets/guest
          bash android/ci/team-check.sh android/assets/guest
          bash android/ci/kit-check.sh android/assets/guest

  build:
    needs: reader-on-arm
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          mkdir -p ci-out
          set -o pipefail
          android/build.sh 2>&1 | tee ci-out/build.log

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an emulator (installs Ubuntu, runs apt)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          script: bash -o pipefail -c "bash android/ci/emulator-test.sh ci-out 2>&1 | tee ci-out/test.log"

      # Build output is also pushed to a hidden ref so it can be read with git.
      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out && cd ci-out
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > commit.txt
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI output for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/ci/termant

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Termant-apk
          path: |
            android/Termant.apk
            ci-out

      - name: Release
        if: success() && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(grep -o 'versionName="[^"]*"' android/AndroidManifest.xml | cut -d'"' -f2)"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" android/Termant.apk --clobber
          else
            gh release create "$version" android/Termant.apk --target "$GITHUB_SHA" \
              --title "Termant $version" \
              --notes "Ubuntu 24.04 terminal for Android 7.0+. Download Termant.apk, open it on your phone and allow the install. First start downloads Ubuntu (about 30 MB)."
          fi
