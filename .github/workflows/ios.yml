name: Termant for iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the app, pack the IPA, smoke-test it
        run: bash ios/ci/ios-test.sh ci-out

      # Logs are also pushed to a hidden ref so they can be read with git.
      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out && cd ci-out
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > commit.txt
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI output for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/ci/termant-ios

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Termant-ios
          path: |
            ios/Termant.ipa
            ci-out

      # A pre-release, so that "latest" keeps pointing at the Android APK.
      - name: Release
        if: success() && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="ios-v0.1.0"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" ios/Termant.ipa --clobber
          else
            gh release create "$version" ios/Termant.ipa --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Termant for iOS 0.1.0" \
              --notes "Termant for iPhone (iOS 14+): the chat of the PC in a small app, with a real microphone. Press the microphone and speak, or turn on \"hey Termant\" from the gear and speak from your pocket. The app is signed by nobody: install Termant.ipa with Sideloadly (on Windows) or AltStore (on a Mac) with any Apple ID — they sign it for your phone, for free. First start: put in the address that the PC shows under Settings → Web chat, and allow the microphone."
          fi
