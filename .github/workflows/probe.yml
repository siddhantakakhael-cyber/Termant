name: Probe
on:
  push:
    paths: ['.github/probe/**', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe-out
          {
            bash .github/probe/tools/build_mirage.sh "$PWD/libs" "$PWD/work"
            abi=x86_64; [ "$(uname -m)" = aarch64 ] && abi=arm64-v8a
            file libs/*/libmirage.so
            bash .github/probe/ci/mirage-check.sh libs/$abi/libmirage.so "$PWD/work"; echo "check exit $?"
            if [ "$(uname -m)" = aarch64 ]; then
              echo "== the 32-bit ARM program on this machine"
              bash .github/probe/ci/mirage-check.sh libs/armeabi-v7a/libmirage.so "$PWD/work"; echo "check exit $?"
            fi
            echo "== three more times, for the time"
            for i in 1 2 3; do s=$(date +%s%N); libs/$abi/libmirage.so work/mirage.cact < work/question.req > /dev/null; echo "$(( ($(date +%s%N) - s) / 1000000 )) ms"; done
          } > probe-out/probe-$(uname -m).log 2>&1 || true
          cat probe-out/*.log
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd probe-out
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "probe ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/ci/termant-probe-$(uname -m)
