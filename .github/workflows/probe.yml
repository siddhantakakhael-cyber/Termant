name: Probe

on:
  push:
    paths: ['.github/probe/**', '.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .github\probe\mirage.ps1 probe-out
          exit 0
      - name: Publish
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p probe-out && cd probe-out
          rm -f runtime.whl mirage.cact libcactus.dll
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "probe ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/ci/termant-probe
