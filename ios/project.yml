# The Xcode project is generated from this file (XcodeGen), in CI and on a Mac alike:
#   xcodegen generate && open Termant.xcodeproj
name: Termant
options:
  bundleIdPrefix: com.termant
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    # The shell's libraries (ios/ish/build.sh) are built for Apple silicon only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    DEVELOPMENT_TEAM: ""
targets:
  Termant:
    type: application
    platform: iOS
    sources:
      - path: Termant
      # The Linux shell inside the app. Before the project is generated:
      #   npm ci (in the repository root), ish/fetch.sh, ish/build.sh iphoneos, ish/build.sh iphonesimulator
      - path: Shell
        excludes:
          - "*.c" # compiled by ish/build.sh together with iSH, whose headers they use
      - path: ish/rootfs/alpine.tar.gz
        buildPhase: resources
      - path: ../node_modules/@xterm/xterm/lib/xterm.js
        buildPhase: resources
      - path: ../node_modules/@xterm/xterm/css/xterm.css
        buildPhase: resources
      - path: ../node_modules/@xterm/addon-fit/lib/addon-fit.js
        buildPhase: resources
      - path: LICENSE.md
        buildPhase: resources
      - path: COPYING
        buildPhase: resources
    info:
      path: Termant/Info.plist
      properties:
        CFBundleDisplayName: Termant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        # The terminal of your own server is often plain http on the home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Termant connects to the terminal server you name in Settings.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termant.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Shell/Termant-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/ish/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -ltermantshell -lish -lish_emu -lfakefs -lsqlite3 -lz -lresolv
  TermantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TermantTests
    dependencies:
      - target: Termant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.termant.app.tests
  TermantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TermantUITests
    dependencies:
      - target: Termant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.termant.app.uitests
schemes:
  Termant:
    build:
      targets:
        Termant: all
        TermantTests: [test]
        TermantUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TermantTests
        - TermantUITests
    archive:
      config: Release
