<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Termant shell</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; -webkit-text-size-adjust: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg, #0d1117); -webkit-user-select: none; user-select: none;
         -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #terminal { flex: 1; min-height: 0; padding: 4px 0 0 6px; box-sizing: border-box; }
  .xterm { height: 100%; }
  #keys { flex: none; display: flex; overflow-x: auto; background: var(--keys, #161b22); -webkit-overflow-scrolling: touch; }
  #keys::-webkit-scrollbar { display: none; }
  #keys button {
    flex: 1 0 auto; min-width: 44px; height: 40px; padding: 0 10px; margin: 0;
    border: 0; border-right: 1px solid var(--bg, #0d1117); border-radius: 0;
    background: transparent; color: var(--fg, #e6edf3);
    font: 15px -apple-system, system-ui, sans-serif; touch-action: manipulation;
  }
  #keys button:active { background: var(--press, #21262d); }
  #keys button.on { background: var(--accent, #ff7a45); color: var(--on, #1a0f08); }
</style>
</head>
<body>
<div id="terminal"></div>
<div id="keys" aria-label="Extra keys">
  <button type="button" data-seq="esc">Esc</button>
  <button type="button" data-seq="tab">Tab</button>
  <button type="button" data-mod="ctrl">Ctrl</button>
  <button type="button" data-mod="alt">Alt</button>
  <button type="button" data-seq="up" aria-label="Up">&#9650;</button>
  <button type="button" data-seq="down" aria-label="Down">&#9660;</button>
  <button type="button" data-seq="left" aria-label="Left">&#9664;</button>
  <button type="button" data-seq="right" aria-label="Right">&#9654;</button>
  <button type="button" data-text="/">/</button>
  <button type="button" data-text="-">-</button>
  <button type="button" data-text="|">|</button>
  <button type="button" data-text="~">~</button>
  <button type="button" data-text="&gt;">&gt;</button>
  <button type="button" data-text="$">$</button>
  <button type="button" data-text="&amp;">&amp;</button>
  <button type="button" data-text="*">*</button>
  <button type="button" data-text="&quot;">&quot;</button>
  <button type="button" data-text="'">'</button>
  <button type="button" data-seq="home">Home</button>
  <button type="button" data-seq="end">End</button>
  <button type="button" data-seq="pgup">PgUp</button>
  <button type="button" data-seq="pgdn">PgDn</button>
</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
(() => {
  'use strict';
  // The page of the shell inside the Termant app. The app (ShellScreen.swift) writes what the
  // shell prints with termantWrite() and gets what is typed through the "termant" message handler.

  const THEMES = {
    dark: {
      page: { bg: '#0d1117', keys: '#161b22', fg: '#e6edf3', press: '#21262d', accent: '#ff7a45', on: '#1a0f08' },
      term: {
        background: '#0d1117', foreground: '#e6edf3', cursor: '#e6edf3', cursorAccent: '#0d1117',
        selectionBackground: '#3b5070',
        black: '#484f58', red: '#ff7b72', green: '#3fb950', yellow: '#d29922',
        blue: '#58a6ff', magenta: '#bc8cff', cyan: '#39c5cf', white: '#b1bac4',
        brightBlack: '#6e7681', brightRed: '#ffa198', brightGreen: '#56d364', brightYellow: '#e3b341',
        brightBlue: '#79c0ff', brightMagenta: '#d2a8ff', brightCyan: '#56d4dd', brightWhite: '#ffffff',
      },
    },
    light: {
      page: { bg: '#ffffff', keys: '#eaeef2', fg: '#24292f', press: '#d0d7de', accent: '#d25a2e', on: '#ffffff' },
      term: {
        background: '#ffffff', foreground: '#24292f', cursor: '#24292f', cursorAccent: '#ffffff',
        selectionBackground: '#b6d6fd',
        black: '#24292f', red: '#cf222e', green: '#116329', yellow: '#7d4e00',
        blue: '#0969da', magenta: '#8250df', cyan: '#1b7c83', white: '#6e7781',
        brightBlack: '#57606a', brightRed: '#a40e26', brightGreen: '#1a7f37', brightYellow: '#633c01',
        brightBlue: '#218bff', brightMagenta: '#a475f9', brightCyan: '#3192aa', brightWhite: '#8c959f',
      },
    },
  };

  const look = window.TERMANT_LOOK || { theme: 'dark', font: 13 };
  const mods = { ctrl: false, alt: false };
  const holder = document.getElementById('terminal');
  const keys = document.getElementById('keys');

  function tell(message) {
    try { window.webkit.messageHandlers.termant.postMessage(message); } catch (e) { /* opened outside the app */ }
  }

  function paint(name) {
    const theme = THEMES[name] || THEMES.dark;
    for (const key of Object.keys(theme.page)) document.documentElement.style.setProperty('--' + key, theme.page[key]);
    return theme.term;
  }

  const term = new Terminal({
    cursorBlink: true,
    fontFamily: 'Menlo, "SF Mono", ui-monospace, monospace',
    fontSize: look.font,
    scrollback: 5000,
    allowProposedApi: true,
    macOptionIsMeta: true,
    theme: paint(look.theme),
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(holder);

  let announced = false;
  function refit() {
    if (!holder.clientWidth || !holder.clientHeight) return;
    try { fit.fit(); } catch (e) { return; }
    if (!announced) {
      announced = true;
      tell({ kind: 'ready', columns: term.cols, rows: term.rows });
    }
  }
  new ResizeObserver(refit).observe(holder);
  window.addEventListener('resize', refit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);

  // ---------------------------------------------------------- typing
  const SEQ = {
    esc: '\x1b', tab: '\t', up: '\x1b[A', down: '\x1b[B', right: '\x1b[C', left: '\x1b[D',
    home: '\x1b[H', end: '\x1b[F', pgup: '\x1b[5~', pgdn: '\x1b[6~',
  };

  function applyMods(data) {
    if (!mods.ctrl && !mods.alt) return data;
    if (data.length === 1) {
      if (mods.ctrl) {
        const c = data.toUpperCase().charCodeAt(0);
        if (c >= 63 && c <= 95) data = String.fromCharCode(c === 63 ? 127 : c - 64);
        else if (data === ' ') data = '\x00';
      }
      if (mods.alt) data = '\x1b' + data;
    }
    mods.ctrl = mods.alt = false;
    updateMods();
    return data;
  }

  function updateMods() {
    for (const b of keys.querySelectorAll('[data-mod]')) {
      const on = mods[b.dataset.mod];
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    }
  }

  term.onData((data) => tell({ kind: 'typed', text: applyMods(data) }));
  term.onBinary((data) => tell({ kind: 'bytes', text: data }));
  term.onResize(({ cols, rows }) => { if (announced) tell({ kind: 'size', columns: cols, rows }); });
  term.onBell(() => tell({ kind: 'bell' }));

  keys.addEventListener('pointerdown', (e) => e.preventDefault()); // the keyboard stays open
  keys.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.mod) {
      mods[b.dataset.mod] = !mods[b.dataset.mod];
      updateMods();
    } else {
      let data = b.dataset.seq ? SEQ[b.dataset.seq] : b.dataset.text;
      // programs that take over the screen ask for the other kind of arrow keys
      if (b.dataset.seq && term.modes.applicationCursorKeysMode && /^\x1b\[[ABCDHF]$/.test(data)) {
        data = '\x1bO' + data[2];
      }
      tell({ kind: 'typed', text: applyMods(data) });
    }
    term.focus();
  });

  // ---------------------------------------------------------- what the app calls
  /** What the shell printed, as base64 of its bytes. */
  window.termantWrite = (base64) => {
    const raw = atob(base64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    term.write(bytes);
  };

  /** A new shell starts on an empty screen. */
  window.termantReset = () => {
    term.reset();
    mods.ctrl = mods.alt = false;
    updateMods();
  };

  window.termantLook = (theme, font) => {
    term.options.theme = paint(theme);
    term.options.fontSize = font;
    refit();
  };

  window.termantPaste = (text) => {
    term.paste(text);
    term.focus();
  };

  window.termantFocus = () => term.focus();

  /** Everything on the screen and above it, as text. */
  window.termantText = () => {
    const buffer = term.buffer.active;
    const lines = [];
    for (let i = 0; i < buffer.length; i++) {
      const line = buffer.getLine(i);
      if (!line) continue;
      const text = line.translateToString(true);
      if (line.isWrapped && lines.length) lines[lines.length - 1] += text;
      else lines.push(text);
    }
    while (lines.length && !lines[lines.length - 1]) lines.pop();
    return lines.join('\n');
  };

  refit();
})();
</script>
</body>
</html>
